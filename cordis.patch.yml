# dsh-tools 整合包 patch 每个子模块插入一行
# 第一条是包根裸包名行 只承载 Client 配置页 第二条是子模块行
- insert:
    - id: dsh-tools
      name: 'dsh-tools'

    - id: dsh-tools-ami
      name: 'dsh-tools/ami'
      config:
        enabled: true
        everyTurns: 10
        maxSourceBytes: 1048576
        maxInjectBytes: 16384
        truncateOversize: true
        wrapSystemReminder: true
        onlyIfChanged: false
        includeSubagents: false
        injectOnChange: false
